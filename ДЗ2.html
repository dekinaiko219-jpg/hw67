<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>дз</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-color: greenyellow;
        }
        .brat{
            display: grid;
            grid-template-columns: repeat(4, 1fr );
            gap: 22px;
            padding: 22px;
            margin: 0 auto;
        }
        .block{
            background-color: black;
            border-radius: 16px;
            min-height: 167px;
        }
        .col2{
            grid-column: span 2;
        }
        .row2{
            grid-row: span 2;
        }
        .colrow2{
            grid-column: span 2;
            grid-row: span 2;
        }
    </style>
</head>
<body>
    <div class="brat">
        <div class="block"></div>
        <div class="block col2"></div>
        <div class="block row2"></div>
        <div class="block"></div>
        <div class="block colrow2"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block col2"></div>
        <div class="block col2"></div>
    </div>
</body>
</html>
